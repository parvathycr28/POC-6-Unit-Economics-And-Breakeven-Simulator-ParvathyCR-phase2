services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: infocreon-unit-economics-backend
    env_file:
      - .env
    ports:
      - "8002:8001"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: infocreon-unit-economics-frontend
    ports:
      - "3001:3000"
    depends_on:
      - backend
    restart: unless-stopped
